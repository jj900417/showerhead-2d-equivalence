[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "showerhead-equiv"
version = "1.0.0"
description = "3D-to-2D equivalence of multi-hole showerhead rings: equivalent annular slot (Eq. 3) and effective wall reaction probability (Eq. 4)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Jung Hwan Yoon" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
showerhead-equiv = "showerhead_equiv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
